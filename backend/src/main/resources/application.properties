# Porta em que a sua API vai rodar localmente
server.port=${PORT:8080}

# ===============================
# CONFIGURACOES DO BANCO (NEON.TECH)
# ===============================
# Substitua HOST, NOME_DO_BANCO, USUARIO e SENHA pelos dados do painel do Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# CONFIGURACOES DO HIBERNATE (ORM)
# ===============================
# O 'update' faz com que o Java leia suas classes e crie/atualize as tabelas no banco automaticamente
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostra no console do IntelliJ os comandos SQL que o Java está executando
spring.jpa.show-sql=true

google.client-id=${GOOGLE_CLIENT_ID}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000


server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
