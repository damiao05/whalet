# Porta em que a sua API vai rodar localmente
server.port=8080

# ===============================
# CONFIGURAÇÕES DO BANCO (NEON.TECH)
# ===============================
# Substitua HOST, NOME_DO_BANCO, USUARIO e SENHA pelos dados do painel do Neon
spring.datasource.url=${NEONDB_URL}
spring.datasource.username=${NEONDB_USER}
spring.datasource.password=${NEONDB_PASSWORD}

# ===============================
# CONFIGURAÇÕES DO HIBERNATE (ORM)
# ===============================
# O 'update' faz com que o Java leia suas classes e crie/atualize as tabelas no banco automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostra no console do IntelliJ os comandos SQL que o Java está executando
spring.jpa.show-sql=true

google.client-id=${GOOGLE_CLIENT_ID}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
