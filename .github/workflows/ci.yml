name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Banco PostgreSQL descartável: o teste aplica TODAS as migrations do zero e o Hibernate confere as entidades.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whalet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/whalet
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Chave descartável, só para a CI (não é a de produção)
      JWT_SECRET: Y2ktb25seS1kdW1teS1zZWNyZXQta2V5LTAxMjM0NTY3ODlhYg==
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      CORS_ORIGINS: http://localhost:4200
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
